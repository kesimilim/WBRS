plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '3'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.3'
}

// Store signing is opt-in. Never silently substitute a debug key for it.
def clrsSigningMode = System.getenv('CLRS_ANDROID_SIGNING_MODE') ?: 'qa'
if (!(clrsSigningMode in ['qa', 'store'])) {
    throw new GradleException('CLRS_ANDROID_SIGNING_MODE must be qa or store.')
}
def clrsStoreSigning = new Properties()
def clrsStoreFile = null
if (clrsSigningMode == 'store') {
    def propertiesPath = System.getenv('CLRS_ANDROID_SIGNING_PROPERTIES')
    if (!propertiesPath || !new File(propertiesPath).isFile()) {
        throw new GradleException('Store signing requires CLRS_ANDROID_SIGNING_PROPERTIES outside Git.')
    }
    def signingFile = new File(propertiesPath).canonicalFile
    signingFile.withInputStream { clrsStoreSigning.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { name ->
        if (!clrsStoreSigning.getProperty(name)) {
            throw new GradleException("Missing store signing setting: ${name}")
        }
    }
    clrsStoreFile = new File(clrsStoreSigning.getProperty('storeFile'))
    if (!clrsStoreFile.isAbsolute()) {
        clrsStoreFile = new File(signingFile.parentFile, clrsStoreSigning.getProperty('storeFile'))
    }
    if (!clrsStoreFile.isFile()) {
        throw new GradleException('The original store keystore was not found.')
    }
}

// JNI libraries from plugins must not advertise an ABI without Flutter's
// own libapp/libflutter. Follow the same target-platform property as Flutter.
def clrsAbiByPlatform = ['android-arm': 'armeabi-v7a', 'android-arm64': 'arm64-v8a',
                        'android-x64': 'x86_64', 'android-x86': 'x86']
def clrsPlatforms = (project.findProperty('target-platform') ?:
        'android-arm,android-arm64,android-x64').toString().split(',')
def clrsAbis = clrsPlatforms.collect { platform ->
    if (!clrsAbiByPlatform.containsKey(platform)) {
        throw new GradleException('Unsupported Flutter target platform.')
    }
    clrsAbiByPlatform[platform]
}

android {
    namespace "com.lrs"
    compileSdk 35
    ndkVersion "26.1.10909125"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.lrs"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 25
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        if (!(project.findProperty('split-per-abi') ?: 'false').toString().toBoolean()) {
            ndk { abiFilters.addAll(clrsAbis) }
        }
        multiDexEnabled true
        manifestPlaceholders = [applicationName: "android.app.Application"]
    }

    flavorDimensions "backend"
    productFlavors {
        production {
            dimension "backend"
        }
        sandbox {
            dimension "backend"
            applicationIdSuffix ".sandbox"
        }
    }

    signingConfigs {
        if (clrsSigningMode == 'store') {
            storeRelease {
                storeFile clrsStoreFile
                storePassword clrsStoreSigning.getProperty('storePassword')
                keyAlias clrsStoreSigning.getProperty('keyAlias')
                keyPassword clrsStoreSigning.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            shrinkResources false
            signingConfig = clrsSigningMode == 'store' ? signingConfigs.storeRelease : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
