# Build the same native Timeweb configuration used by the reviewed Android APK.
# Source publication never triggers a deployment to Firebase or a store upload.
image: ghcr.io/cirruslabs/flutter:3.32.5@sha256:9eba5da55e0f77630511cac7687d19d231d5acaa7e8bffd07572b45357624289

stages: [test, build]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  FLUTTER_SUPPRESS_ANALYTICS: "true"

cache:
  key:
    files: [pubspec.lock]
  paths: [.pub-cache/]

before_script:
  - flutter --version
  - flutter pub get

timeweb_startup_regression:
  stage: test
  script:
    - python3 -m unittest discover -s tool -p 'test_build_timeweb.py' -v
    - flutter test --no-pub test/startup_retry_test.dart test/backend_isolation_test.dart test/timeweb_push_test.dart test/timeweb_notifications_test.dart
    - flutter test --no-pub --dart-define-from-file=config/timeweb.production.json test/timeweb_optional_notifications_startup_test.dart

full_validation:
  stage: test
  when: manual
  allow_failure: true
  script:
    - flutter analyze --no-fatal-infos
    - flutter test --no-pub
    - flutter test --no-pub --dart-define-from-file=config/timeweb.production.json test/timeweb_optional_notifications_startup_test.dart

android_timeweb_qa:
  stage: build
  when: manual
  allow_failure: true
  script:
    # Set CLRS_BUILD_NUMBER explicitly when starting the job.
    - python3 tool/build_timeweb.py --mode qa
  artifacts:
    paths: [build/delivery/qa/]
    expire_in: 14 days

android_store_candidate:
  stage: build
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  script:
    # Original keystore/properties must be supplied through protected CI secrets.
    # This only creates a signed candidate; it does not publish to RuStore.
    - python3 tool/build_timeweb.py --mode store
  artifacts:
    paths: [build/delivery/store/]
    expire_in: 14 days
